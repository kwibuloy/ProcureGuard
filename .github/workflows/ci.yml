name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: pip install -r requirements-lock.txt
      - run: ruff check pipeline ml tests
      - run: ruff format --check pipeline ml tests
      - run: python -m pytest pipeline ml

  node:
    name: ${{ matrix.package }} (eslint, typecheck, vitest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [api, dashboard]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: End to end (PostgreSQL, ml, API)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: procureguard
          POSTGRES_PASSWORD: procureguard
          POSTGRES_DB: procureguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U procureguard -d procureguard"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_USER: procureguard
      POSTGRES_PASSWORD: procureguard
      POSTGRES_DB: procureguard
      # Makes the end-to-end test fail, not skip, when PostgreSQL or Node is missing.
      E2E_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: pip install -r requirements-lock.txt
      - run: npm ci
        working-directory: api
      - run: python -m pytest tests/e2e -rs
